<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>AETHERIA — World Build 01</title>
<style>
html,body{margin:0;overflow:hidden;background:#b8d8ed;font-family:system-ui;color:white;touch-action:none}
#hud{position:fixed;inset:0;pointer-events:none}
#title{position:absolute;top:12px;left:12px;text-shadow:0 2px 8px #17332c;font-weight:700;letter-spacing:2px}
#status{position:absolute;top:44px;left:12px;background:#142c2877;padding:7px 10px;border-radius:10px;font-size:12px}
#joystick{position:absolute;left:24px;bottom:25px;width:118px;height:118px;border-radius:50%;background:#ffffff22;border:1px solid #ffffff55;pointer-events:auto}
#stick{position:absolute;left:37px;top:37px;width:44px;height:44px;border-radius:50%;background:#ffffff66;border:1px solid #fff}
#look{position:absolute;right:0;bottom:0;width:54%;height:55%;pointer-events:auto}
#action{position:absolute;right:25px;bottom:30px;width:70px;height:70px;border-radius:50%;background:#8de6ce44;border:1px solid #fff8;pointer-events:auto;display:grid;place-items:center;font-size:13px}
#hint{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;text-shadow:0 1px 5px #000;white-space:nowrap}
</style>
</head>
<body>
<div id="hud"><div id="title">AETHERIA</div><div id="status">WORLD BUILD 01 · Explore the valley</div>
<div id="joystick"><div id="stick"></div></div><div id="look"></div><div id="action">تفاعل</div><div id="hint">اسحب العصا للحركة · اسحب يمين الشاشة لتدوير الكاميرا</div></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(()=> {
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x9ccce5); scene.fog=new THREE.Fog(0x9ccce5,75,240);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,500);
const renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:"low-power"});
renderer.setSize(innerWidth,innerHeight); renderer.setPixelRatio(Math.min(devicePixelRatio,1.25)); renderer.shadowMap.enabled=false;
renderer.outputColorSpace=THREE.SRGBColorSpace; document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xdaf0ff,0x64734b,2));
const sun=new THREE.DirectionalLight(0xfff1cf,2.1);sun.position.set(-40,80,30);scene.add(sun);
const mat=(c,rough=1)=>new THREE.MeshStandardMaterial({color:c,roughness:rough});
const grass=mat(0x648f50), hillmat=mat(0x607b58), rock=mat(0x777d80), trunk=mat(0x62432b), leaves=[mat(0x386d43),mat(0x477d48),mat(0x57884a)], water= new THREE.MeshStandardMaterial({color:0x4ba8d1,roughness:.25,metalness:.08}), sand=mat(0xc6b482), wood=mat(0x79583b), roof=mat(0x70493c), stone=mat(0x85877c);
function mesh(g,m,x,y,z,sx=1,sy=1,sz=1){let o=new THREE.Mesh(g,m);o.position.set(x,y,z);o.scale.set(sx,sy,sz);scene.add(o);return o}
mesh(new THREE.PlaneGeometry(320,320),grass,0,-.3,0,1,1,1).rotation.x=-Math.PI/2;
// distant mountain ring
for(let i=0;i<24;i++){let a=i/24*Math.PI*2,r=115+Math.random()*15,h=22+Math.random()*38;mesh(new THREE.ConeGeometry(18+Math.random()*15,h,5),hillmat,Math.cos(a)*r,h/2-3,Math.sin(a)*r).rotation.y=Math.random()*2;}
function tree(x,z,size=1){mesh(new THREE.CylinderGeometry(.25*size,.4*size,3.2*size,6),trunk,x,1.6*size,z);for(let k=0;k<3;k++)mesh(new THREE.ConeGeometry(2.4*size,3.2*size,7),leaves[k%3],x,(3+k*1.15)*size,z);}
for(let i=0;i<210;i++){let x=(Math.random()-.5)*210,z=(Math.random()-.5)*210;if(Math.abs(x)<17&&z>-30&&z<22)continue;if(Math.abs(x)<10&&Math.abs(z)<10)continue;tree(x,z,.65+Math.random()*.85)}
// river winding
const riverPts=[];for(let i=0;i<=20;i++){let z=-100+i*10;riverPts.push(new THREE.Vector3(Math.sin(i*.34)*10,0.05,z))}
const curve=new THREE.CatmullRomCurve3(riverPts);let riverMesh=new THREE.Mesh(new THREE.TubeGeometry(curve,120,3.6,8,false),water);scene.add(riverMesh);
// banks and bridge
mesh(new THREE.BoxGeometry(14,.4,2),wood,0,.4,8);for(let side of [-1,1])for(let i=0;i<5;i++)mesh(new THREE.BoxGeometry(.25,1.3,.25),trunk,side*6,.8,7+i*.35);
// village houses
function house(x,z,scale=1){mesh(new THREE.BoxGeometry(6*scale,4*scale,5*scale),sand,x,2*scale,z);mesh(new THREE.ConeGeometry(4.3*scale,2.5*scale,4),roof,x,5*scale,z).rotation.y=Math.PI/4;mesh(new THREE.BoxGeometry(1.1*scale,2.1*scale,.12),wood,x,1.1*scale,z+2.56*scale);mesh(new THREE.BoxGeometry(1*scale,1*scale,.12),mat(0x8bc6d2),x-1.6*scale,2.5*scale,z+2.56*scale);}
house(-22,-8,1.15);house(-31,-18,.9);house(-18,-23,.85);house(-35,1,1.0);
for(let i=0;i<16;i++){let x=-29+Math.random()*16,z=-24+Math.random()*20;mesh(new THREE.CylinderGeometry(.15,.25,2,5),wood,x,1,z);mesh(new THREE.SphereGeometry(.9,7,5),leaves[1],x,2.2,z)}
// ruins
for(let i=0;i<8;i++){let a=i*Math.PI/4;mesh(new THREE.BoxGeometry(1.2,5,1.2),stone,Math.cos(a)*24,2.5,Math.sin(a)*24);}
// crystals
const crystalMat=new THREE.MeshStandardMaterial({color:0x67f1ff,emissive:0x137caa,emissiveIntensity:1.3,roughness:.25});
function crystal(x,z,s=1){mesh(new THREE.OctahedronGeometry(1,0),crystalMat,x,.9*s,z,.5*s,1.5*s,.5*s);mesh(new THREE.OctahedronGeometry(.65,0),crystalMat,x+1*s,.6*s,z+.6*s,.35*s,1*s,.35*s)}
crystal(15,-10,1.4);crystal(20,-15,1);crystal(8,-18,1.2);crystal(35,25,1.4);crystal(-48,42,1.5);
// player stylized capsule + tunic
const player=new THREE.Group();scene.add(player);
mesh(new THREE.CylinderGeometry(.38,.42,1.25,7),mat(0x3e587e),0,.85,0).parent=player;
mesh(new THREE.SphereGeometry(.38,8,6),mat(0xe0c29c),0,1.65,0).parent=player;
mesh(new THREE.ConeGeometry(.48,.5,6),mat(0x4c3026),0,2.0,0).parent=player;
player.position.set(0,0,15);
// player mesh helper created in scene; attach via reparent and local coords
// remove accidental scene placement for body pieces and reset local
for(let child of [...scene.children]){if(child.isMesh&&child.position.x===0&&child.position.z===0&&child.position.y>0&&child!==player){scene.remove(child);player.add(child);child.position.set(0,child.position.y,0)}}
let yaw=0,camYaw=0,camPitch=.25,moveX=0,moveY=0,joyOn=false,lastX=0,lastY=0;
function updateCamera(){let target=player.position.clone().add(new THREE.Vector3(0,1.2,0));let dist=7;camera.position.set(target.x+Math.sin(camYaw)*dist,target.y+2+camPitch*5,target.z+Math.cos(camYaw)*dist);camera.lookAt(target)}
updateCamera();
const joy=document.getElementById("joystick"),stick=document.getElementById("stick");
joy.addEventListener("pointerdown",e=>{joyOn=true;joy.setPointerCapture(e.pointerId);joyMove(e)});
joy.addEventListener("pointermove",e=>{if(joyOn)joyMove(e)});
joy.addEventListener("pointerup",()=>{joyOn=false;moveX=moveY=0;stick.style.transform="translate(0,0)"});
function joyMove(e){let r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,len=Math.hypot(dx,dy),max=42;if(len>max){dx*=max/len;dy*=max/len}moveX=dx/max;moveY=-dy/max;stick.style.transform=`translate(${dx}px,${dy}px)`}
const look=document.getElementById("look");look.addEventListener("pointerdown",e=>{lastX=e.clientX;lastY=e.clientY;look.setPointerCapture(e.pointerId)});look.addEventListener("pointermove",e=>{if(e.buttons){camYaw-=(e.clientX-lastX)*.006;camPitch=Math.max(-.15,Math.min(.6,camPitch+(e.clientY-lastY)*.004));lastX=e.clientX;lastY=e.clientY;updateCamera()}});
document.getElementById("action").onclick=()=>{document.getElementById("status").textContent="استكشف الوادي وابحث عن البلورات"};
const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);let dt=Math.min(clock.getDelta(),.05);if(moveX||moveY){let forward=new THREE.Vector3(-Math.sin(camYaw),0,-Math.cos(camYaw)),right=new THREE.Vector3(Math.cos(camYaw),0,-Math.sin(camYaw));let dir=forward.multiplyScalar(moveY).add(right.multiplyScalar(moveX));if(dir.length()>1)dir.normalize();player.position.addScaledVector(dir,7*dt);player.rotation.y=Math.atan2(dir.x,dir.z);updateCamera()}renderer.render(scene,camera)}animate();
addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.25));
})();
</script>
</body></html>
